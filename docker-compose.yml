# LAN only. Do not port-forward these ports.
# I run this on a UGREEN DXP4800 Pro (Intel) — do not add it to
# QuickConnect / UGREEN remote access. Drop `platform: linux/amd64`
# if your Docker host is not amd64.

services:
  vinyl-scrobbler:
    build: .
    image: visual-vinyl-scrobbler:local
    platform: linux/amd64
    container_name: visual-vinyl-scrobbler
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    platform: linux/amd64
    container_name: visual-vinyl-scrobbler-https
    restart: unless-stopped
    depends_on:
      - vinyl-scrobbler
    ports:
      # HTTPS for the iPad camera. 3443 avoids colliding with host 443.
      - "3443:3443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certificates:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
